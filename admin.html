<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>관리자 페이지</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing:border-box; }
  body { margin:0; background:#faf8f3; color:#1d1d1f;
         font:400 14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:22px 18px 60px; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { font-size:19px; margin:0; font-weight:750; }
  .grow { flex:1; }
  .btn { border:1px solid #e6e2d6; background:#fff; color:#333; border-radius:99px;
         padding:7px 15px; font:600 12.5px/1.3 inherit; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn:hover { border-color:#b78a22; }
  .btn.dark { background:#1a1a1a; border-color:#1a1a1a; color:#fff; }
  .who { font-size:12.5px; color:#777; }

  .panel { background:#fff; border:1px solid #efece2; border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .tab { border:1px solid #e6e2d6; background:#fff; color:#666; border-radius:99px;
         padding:7px 15px; font:600 12.5px/1.3 inherit; cursor:pointer; }
  .tab.active { background:#1a1a1a; border-color:#1a1a1a; color:#fff; }

  .filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  input, select { border:1px solid #e6e2d6; border-radius:9px; padding:8px 11px;
                  font:400 13px/1.4 inherit; background:#fff; color:#1d1d1f; }
  input[type=search] { min-width:230px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .card { background:#fff; border:1px solid #efece2; border-radius:12px; padding:14px 16px; }
  .card .n { font:800 25px/1.2 inherit; }
  .card .l { font-size:11.5px; color:#999; font-weight:600; letter-spacing:.04em; }

  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; font-weight:700; color:#888; font-size:11px; letter-spacing:.05em;
       text-transform:uppercase; padding:8px 10px; border-bottom:1px solid #f0efe9; white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid #f6f5f0; vertical-align:top; }
  tr:hover td { background:#fdfcf8; }
  .scroll { overflow:auto; max-height:calc(100vh - 340px); border:1px solid #f0efe9; border-radius:10px; }
  .mono { font-variant-numeric:tabular-nums; }
  .muted { color:#999; }
  .tag { display:inline-block; border-radius:99px; padding:1px 8px; font-size:11px; font-weight:700; }
  .tag.hold { background:#fdf6e3; color:#8a6d1f; }
  .tag.forced { background:#fdecea; color:#a23b2e; }
  .tag.multi { background:#eef3fb; color:#2b5b8a; }
  .err { background:#fdecea; border:1px solid #f3c4bf; color:#a23b2e; border-radius:10px;
         padding:12px 15px; font-size:13px; line-height:1.6; }
  .note { background:#fdf6e3; border:1px solid #ecdcae; color:#8a6d1f; border-radius:10px;
          padding:11px 14px; font-size:12.5px; line-height:1.6; margin-bottom:12px; }
  .gate { max-width:340px; margin:70px auto; }
  .gate input { width:100%; margin-bottom:8px; }

  /* 파이프라인 (칸반) */
  .kan { display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; align-items:flex-start; }
  .kcol { flex:0 0 300px; background:#f7f5ef; border:1px solid #ece8dc; border-radius:14px; padding:10px; }
  .khead { display:flex; align-items:center; gap:8px; font:700 13px/1.4 inherit; padding:4px 6px 10px; }
  .kdot { width:9px; height:9px; border-radius:50%; flex:none; }
  .kcount { margin-left:auto; background:#fff; border:1px solid #e6e2d6; border-radius:99px; padding:1px 9px; font-size:12px; color:#666; }
  .klist { display:flex; flex-direction:column; gap:9px; max-height:calc(100vh - 300px); overflow-y:auto; }
  .kcard { background:#fff; border:1px solid #ececec; border-radius:11px; padding:11px 12px; cursor:pointer; }
  .kcard:hover { border-color:#b78a22; box-shadow:0 3px 12px rgba(183,138,34,.12); }
  .kcard .knm { font:700 13px/1.35 inherit; color:#1d1d1f; }
  .kcard .kh { font-size:11.5px; color:#999; margin-bottom:5px; }
  .kcard .kmeta { font-size:11.5px; color:#6b6b6b; display:flex; gap:8px; flex-wrap:wrap; }
  .kcard .kbadge { background:#fbf1d3; color:#8a6d16; border-radius:6px; padding:0 6px; font-weight:600; }
  .kcard .krem { background:#fde4cf; color:#b5651d; border-radius:6px; padding:0 6px; font-weight:600; }
  .kcard .ksub { font-size:11.5px; color:#999; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kempty { color:#bbb; font-size:12px; text-align:center; padding:24px 0; }

  /* 대화 목록 */
  .convgrp { margin-bottom:18px; }
  .convby { font:700 14px/1.4 inherit; margin:0 2px 8px; }
  .convrow td { cursor:pointer; }
  .convrow:hover td { background:#fdfcf8; }

  /* 협상 스레드 모달 */
  .veil { position:fixed; inset:0; background:rgba(20,18,12,.5); display:flex;
          align-items:center; justify-content:center; padding:20px; z-index:50; }
  .tmodal { background:#fff; border-radius:16px; width:100%; max-width:720px; max-height:86vh;
            display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden; }
  .tmhead { display:flex; align-items:center; gap:10px; padding:16px 18px 6px; font:700 15px/1.4 inherit; }
  .tmhead .x { margin-left:auto; border:0; background:none; font-size:18px; color:#999; cursor:pointer; }
  .tmnote { padding:0 18px 12px; font-size:11.5px; border-bottom:1px solid #f0efe9; }
  .tmbody { overflow:auto; padding:16px 18px 20px; background:#f7f5ef; }
  .bubble { max-width:82%; margin:0 0 12px; padding:10px 13px; border-radius:14px; font-size:13.5px; line-height:1.6; }
  .bubble .bh { font-size:11px; color:#8a8a8a; margin-bottom:3px; font-weight:600; }
  .bubble .bsub { font-weight:700; font-size:12.5px; margin-bottom:5px; color:#333; }
  .bubble .btext { white-space:pre-wrap; word-break:break-word; color:#222; }
  .bubble.in  { background:#fff; border:1px solid #ececec; margin-right:auto; border-top-left-radius:4px; }
  .bubble.out { background:#fbf1d3; border:1px solid #ecd9a6; margin-left:auto; border-top-right-radius:4px; }

  /* 언어 전환 */
  .langs { display:inline-flex; gap:3px; border:1px solid #e6e2d6; border-radius:99px; padding:2px; background:#fff; }
  .langbtn { border:0; background:transparent; color:#777; border-radius:99px;
             padding:4px 10px; font:600 11.5px/1.3 inherit; cursor:pointer; white-space:nowrap; }
  .langbtn.on { background:#1a1a1a; color:#fff; }


  /* ── 일별 차트 ──
     색은 눈대중이 아니라 검증기를 돌려 통과시킨 값이다
     (골드↔초록 CVD ΔE 9.0 protan · 일반 18.3, 둘 다 표면 대비 3:1 이상).
     계열 색은 막대에만 쓰고 글자에는 쓰지 않는다 — 옆의 색 점이 정체를 나타낸다. */
  .viz { --surface:#ffffff; --sent:#B78A22; --replied:#158a61; --blocked:#2a78d6;
         --grid:#eceae3; --ink:#1d1d1f; --ink2:#6b6b6b; }
  .vizwrap { overflow-x:auto; padding:2px 0 4px; position:relative; }
  .viz svg { display:block; }
  .viz .gridline { stroke:var(--grid); stroke-width:1; shape-rendering:crispEdges; }
  .viz .tick { fill:var(--ink2); font-size:10.5px; }
  .viz .hit { fill:transparent; cursor:default; }
  .viz .hit:hover + .band, .viz .band.on { fill:#faf8f3; }
  .viz .band { fill:transparent; pointer-events:none; }
  .legend { display:flex; gap:14px; align-items:center; font-size:12px; color:#6b6b6b; margin:2px 0 10px; }
  .legend i { width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:5px; vertical-align:-1px; }
  .tip { position:absolute; pointer-events:none; background:#1a1a1a; color:#fff; border-radius:8px;
         padding:8px 11px; font-size:12px; line-height:1.55; white-space:nowrap; opacity:0;
         transition:opacity .08s; z-index:5; box-shadow:0 6px 20px rgba(0,0,0,.18); }
  .tip.on { opacity:1; }
  .tip b { font-weight:700; }
  .tip .k { color:#c9c6bd; }
</style>
</head>
<body>

<div class="wrap" id="app" style="display:none">
  <header>
    <h1>📊 관리자 페이지</h1>
    <span class="who" id="who"></span>
    <span class="grow"></span>
    <span class="langs" id="langs"></span>
    <a class="btn" href="/index.html">✉️ 발송 화면</a>
    <button class="btn" onclick="logout()">로그아웃</button>
  </header>

  <div id="msg"></div>

  <div class="tabs">
    <button class="tab active" data-v="summary" onclick="go('summary')">담당자별</button>
    <button class="tab" data-v="daily" onclick="go('daily')">📈 일별</button>
    <button class="tab" data-v="weekly" onclick="go('weekly')">📅 주차별</button>
    <button class="tab" data-v="pipeline" onclick="go('pipeline')">🗂 내 파이프라인</button>
    <button class="tab" data-v="conversations" onclick="go('conversations')">💬 대화</button>
    <button class="tab" data-v="book" onclick="go('book')">📒 주소록</button>
    <button class="tab" data-v="blocked" onclick="go('blocked')">⏸ 중복 시도</button>
  </div>

  <div class="panel">
    <div class="filters" id="filters">
      <input type="search" id="q" placeholder="이메일 · 이름 · 핸들 · 캠페인 검색…" oninput="debounced()" />
      <select id="days" onchange="load()">
        <option value="0">전체 (2026-05-01~)</option>
        <option value="7">최근 7일</option>
        <option value="14">최근 14일</option>
        <option value="30">최근 30일</option>
      </select>
      <select id="by" onchange="load()"><option value="">담당자 전체</option></select>
      <span class="muted" id="count"></span>
    </div>
    <div id="body"></div>
  </div>
</div>

<!-- 로그인 -->
<div class="wrap gate" id="gate" style="display:none">
  <div class="panel">
    <h1 style="margin-bottom:12px">🔐 관리자 로그인</h1>
    <div class="langs" id="langsGate" style="margin-bottom:10px"></div>
    <div id="gateMsg" class="muted" style="font-size:12.5px;margin-bottom:10px"></div>
    <input id="gid" placeholder="아이디" autocomplete="username" />
    <input id="gpw" type="password" placeholder="비밀번호" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn dark" style="width:100%" onclick="doLogin()">로그인</button>
  </div>
</div>

<!-- 협상 스레드 (관리자가 대화 하나를 열어 본문까지 본다) -->
<div class="veil" id="threadModal" style="display:none">
  <div class="tmodal">
    <div class="tmhead"><span id="threadHead"></span><button class="x" onclick="closeThread()" aria-label="닫기">✕</button></div>
    <div class="tmnote muted">메일함에서 직접 읽어 옵니다 · 본문은 저장하지 않습니다</div>
    <div class="tmbody" id="threadBody"></div>
  </div>
</div>

<script src="/i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let VIEW = "summary";
/* 대화(본문)를 열 수 없는 메일함 — 관리자 메일함(본인 제외). 서버가 매 응답에 알려 준다(서버도 막는다). */
let HIDDEN_BOX = new Set();
function canOpen(staff){ return Boolean(staff) && !HIDDEN_BOX.has(String(staff).toLowerCase()); }
let ME = null;

/* 발송 화면과 같은 세션 토큰을 쓴다 — 두 번 로그인하지 않도록 */
const token = () => localStorage.getItem("nwtoken") || "";
const headers = () => ({ authorization: "Bearer " + token() });

function showGate(m){ $("gate").style.display=""; $("app").style.display="none"; $("gateMsg").textContent = m||""; }
function logout(){ localStorage.removeItem("nwtoken"); location.reload(); }

async function doLogin(){
  const id = $("gid").value.trim(), pw = $("gpw").value;
  if(!id || !pw) return;
  try {
    const r = await fetch("/api/login", { method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({ id, pw }) });
    const d = await r.json();
    if(!r.ok || d.error) { $("gateMsg").textContent = d.error || "로그인 실패"; return; }
    localStorage.setItem("nwtoken", d.token);
    $("gpw").value = "";
    boot();
  } catch(e){ $("gateMsg").textContent = String(e.message||e); }
}

/* ── 날짜·시간 표기 ── */
function fmt(s){
  if(!s) return "";
  const d = new Date(s);
  if(isNaN(d)) return String(s).slice(0,16);
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function person(r){ return esc(r.byName || r.by || "—"); }

/* ── 탭 ── */
function go(v){
  VIEW = v;
  [...document.querySelectorAll(".tab")].forEach(t => {
    t.className = "tab" + (t.dataset.v === v ? " active" : "");
  });
  load();
}

let tmr = null;
function debounced(){ clearTimeout(tmr); tmr = setTimeout(load, 350); }

async function load(){
  $("body").innerHTML = '<div class="muted" style="padding:20px 0">불러오는 중…</div>';
  $("msg").innerHTML = "";
  try {
    const r = await loadAdmin();
    if(r) $("count").textContent = r;
  } catch(e){
    $("body").innerHTML = "";
    $("msg").innerHTML = '<div class="err">'+esc(String(e.message||e))+'</div>';
  }
}

async function fetchJson(url){
  const r = await fetch(url, { cache:"no-store", headers: headers() });
  if(r.status === 401){ showGate("다시 로그인해 주세요."); throw new Error("로그인이 필요합니다"); }
  // JSON 이 아니면(시간 초과·서버 오류 페이지) 알아볼 수 있는 문구로 — "Unexpected token 'A'" 대신
  const text = await r.text();
  let d;
  try { d = JSON.parse(text); } catch(_) {
    if(r.status === 504 || /timeout|FUNCTION_INVOCATION/i.test(text))
      throw new Error("시간 초과 — 서버가 60초 안에 끝내지 못했습니다. 잠시 뒤 다시 열어 주세요.");
    throw new Error("서버 오류 (HTTP "+r.status+")");
  }
  // 저장소 미연결은 "고장" 이 아니라 "아직 설정 안 됨" 이다.
  // 여기서 던져 버리면 무엇을 해야 하는지 안내할 기회를 잃는다.
  if(d.error && d.historyEnabled !== false) throw new Error(d.error);
  return d;
}

/* 이력 저장소가 없을 때 — 빨간 에러 대신 무엇을 하면 되는지 보여준다 */
function setupGuide(d){
  return '<div class="note"><b>발송 이력 저장소가 아직 연결되지 않았습니다.</b><br />' +
    '이력이 쌓일 곳이 없어서 담당자별·크리에이터별·중복 시도를 보여줄 수 없습니다. ' +
    '중복 발송 차단도 함께 꺼져 있는 상태입니다.</div>' +
    '<div style="font-size:13px;line-height:1.9;padding:4px 2px 10px">' +
    '<b>붙이는 법 (한 번만)</b><br />' +
    '1. Vercel → 이 프로젝트 → <b>Storage</b> 탭 → <b>Create Database</b><br />' +
    '2. <b>Upstash Redis</b> 선택 → 프로젝트에 <b>Connect</b><br />' +
    '3. <b>Deployments</b> → 맨 위 배포의 <b>⋯</b> → <b>Redeploy</b><br />' +
    '<span class="muted">연결하면 KV_REST_API_URL / KV_REST_API_TOKEN 이 자동으로 들어갑니다. ' +
    '무료 티어로 충분합니다.</span></div>' +
    '<div class="note">붙이고 나면 담당자별 화면의 <b>[🔄 메일함에서 동기화]</b> 로 ' +
    '<b>2026-05-01 이후</b> 발송·회신을 메일함에서 채울 수 있습니다.</div>';
}

async function loadAdmin(){
  const qs = new URLSearchParams({ view: VIEW });
  if($("q").value.trim()) qs.set("q", $("q").value.trim());
  if($("days").value !== "0") qs.set("days", $("days").value);
  if($("by").value) qs.set("by", $("by").value);
  // 서버 기록은 UTC 다. 한국 아침 8시 발송은 UTC 로 전날이라, 시차를 넘겨야 날짜가 안 밀린다.
  if(VIEW === "daily" || VIEW === "weekly") qs.set("tz", String(new Date().getTimezoneOffset()));
  if(VIEW === "book") qs.set("dir", BOOK_DIR);
  const d = await fetchJson("/api/admin?" + qs);
  HIDDEN_BOX = new Set((d.hiddenMailboxes || []).map(x => String(x).toLowerCase()));

  if(d.historyEnabled === false){
    $("body").innerHTML = setupGuide(d);
    return "";
  }
  if(VIEW === "daily")   return renderDaily(d);
  if(VIEW === "weekly")  return renderWeekly(d);
  if(VIEW === "summary") return renderSummary(d);
  if(VIEW === "blocked") return renderBlocked(d);
  if(VIEW === "conversations") return renderConversations(d);
  if(VIEW === "book")     return renderBook(d);
  if(VIEW === "pipeline") return renderPipeline(d);
  return "";
}

/* 기록이 하나도 없을 때. 동기화는 자동으로 돌지 않으므로, 빈 표만 보여주면
   "고장인가" 와 "아직 안 눌렀나" 를 구분할 수 없다. 무엇을 하면 되는지 같이 띄운다. */
/* 자동 동기화가 마지막으로 언제 돌았는지. 숫자가 낡았는지 화면에서 바로 알아야 한다 */
function cronNote(d){
  const c = d.cron;
  if(!c) return '자동 동기화(매일 07:00 KST)가 아직 돈 기록이 없습니다. ' +
           '눌러서 <b>2026-05-01 이후</b> 발송·회신을 지금 바로 가져오세요.';
  const when = fmt(c.at);
  const rem = c.reminders;
  return '마지막 자동 동기화 <b>'+esc(when)+'</b>' +
    (c.complete ? '' : ' <span style="color:#a8801f">(전원을 다 못 돌아 다음 실행이 이어받습니다)</span>') +
    (c.totals && c.totals.failed ? ' <span style="color:#a23b2e">· 실패 '+c.totals.failed+'명</span>' : '') +
    (rem && (rem.sent || rem.replied) ? ' <span class="muted">· 리마인드 '+(rem.sent||0)+'건 발송'+
      (rem.replied ? ', 회신 도착으로 '+rem.replied+'건 종료' : '')+'</span>' : '') +
    ' <span class="muted">· 매일 07:00(KST) 자동 실행</span>';
}

function emptyNote(d){
  if((d.totals && d.totals.sent) || (d.rows && d.rows.length)) return "";
  return '<div class="note"><b>아직 기록이 없습니다.</b><br />' +
    '자동 동기화는 <b>매일 07:00(KST)</b>에 돕니다. 아직 한 번도 안 돌았다면, 담당자별 탭의 ' +
    '<b>[🔄 메일함에서 동기화]</b> 로 <b>2026-05-01 이후</b> 발송·회신을 지금 바로 가져올 수 있습니다.<br />' +
    '<span class="muted">담당자 수에 따라 몇 분 걸립니다. 이 도구로 새로 보내는 메일은 기다리지 않아도 바로 잡힙니다.</span></div>';
}

function truncNote(d){

    ? '<div class="note">기록이 많아 최근 것부터 일부만 불러왔습니다. 기간이나 검색어로 좁혀 보세요.</div>'

/* 담당자 선택칸은 **등록된 직원 명단**으로 채운다.

/* ── 일별 발송 ──
   시간축을 따라 크기를 비교하는 일이므로 세로 막대다. 계열은 둘(발송·중복 시도)이라
   범례를 항상 두고, 값은 점마다 찍지 않고 마우스를 올렸을 때만 보여준다. */
const BAND = 26, BARW = 9, GAP = 2, H = 190, PADT = 12, PADB = 26, PADL = 34;

// 위 모서리만 둥근 막대. rect 의 rx 는 네 모서리를 다 깎아 바닥이 떠 보인다.
function barPath(x, y, w, h, r){
  if(h <= 0) return "";
  const rr = Math.min(r, w/2, h);
  return "M"+x+","+(y+h)+" L"+x+","+(y+rr)+" Q"+x+","+y+" "+(x+rr)+","+y+
         " L"+(x+w-rr)+","+y+" Q"+(x+w)+","+y+" "+(x+w)+","+(y+rr)+" L"+(x+w)+","+(y+h)+" Z";
}

// 비율 표기 — 분모가 0이면 숫자 대신 줄표를 낸다 (0% 는 거짓말이다)
function pct(a, b){ return b ? Math.round(a/b*100) + "%" : "—"; }

function niceMax(n){
  if(n <= 4) return Math.max(n, 4);
  const p = Math.pow(10, Math.floor(Math.log10(n)));
  return Math.ceil(n / (p/2)) * (p/2);
}

function renderDaily(d){
  const rows = d.rows || [];
  if(!rows.length){ $("body").innerHTML = emptyNote(d); return ""; }

  const totalSent = rows.reduce((s,r)=>s+r.sent,0);
  const totalBlocked = rows.reduce((s,r)=>s+r.blocked,0);
  const totalReplied = rows.reduce((s,r)=>s+(r.replied||0),0);
  const busiest = rows.reduce((a,b)=> b.sent > a.sent ? b : a, rows[0]);
  const activeDays = rows.filter(r=>r.sent>0).length;
  const max = niceMax(Math.max(1, ...rows.map(r=>Math.max(r.sent, r.replied||0))));

  const W = PADL + rows.length * BAND + 8;
  const plotH = H - PADT - PADB;
  const y = v => PADT + plotH - (v / max) * plotH;

  // 가로선 4개 — 표면에서 한 단계만 떨어진 회색, 눈에 띄지 않게
  let g = "";
  for(let i=0;i<=4;i++){
    const v = max * i / 4, yy = y(v);
    g += '<line class="gridline" x1="'+PADL+'" y1="'+yy+'" x2="'+W+'" y2="'+yy+'" />' +
         '<text class="tick" x="'+(PADL-7)+'" y="'+(yy+3.5)+'" text-anchor="end">'+Math.round(v)+'</text>';
  }

  // 날짜 라벨은 겹치지 않을 만큼만
  const every = Math.max(1, Math.ceil(rows.length / 12));

  let bars = "", hits = "";
  rows.forEach((r,i) => {
    const x0 = PADL + i * BAND;
    const bx = x0 + (BAND - (BARW*2 + GAP)) / 2;
    if(r.sent)    bars += '<path d="'+barPath(bx, y(r.sent), BARW, PADT+plotH-y(r.sent), 4)+'" fill="var(--sent)" />';
    if(r.replied) bars += '<path d="'+barPath(bx+BARW+GAP, y(r.replied), BARW, PADT+plotH-y(r.replied), 4)+'" fill="var(--replied)" />';

    if(i % every === 0){
      bars += '<text class="tick" x="'+(x0+BAND/2)+'" y="'+(H-8)+'" text-anchor="middle">'+
              esc(r.date.slice(5).replace("-","/"))+'</text>';
    }
    // 손이 닿는 곳은 막대보다 넓게 — 하루 칸 전체
    hits += '<rect class="band" x="'+x0+'" y="'+PADT+'" width="'+BAND+'" height="'+plotH+'" />' +
            '<rect class="hit" x="'+x0+'" y="'+PADT+'" width="'+BAND+'" height="'+plotH+
            '" data-i="'+i+'" />';
  });

  $("body").innerHTML =
    '<div class="cards">' +
      '<div class="card"><div class="l">기간 내 발송</div><div class="n mono">'+totalSent+'</div></div>' +
      '<div class="card"><div class="l">발송한 날</div><div class="n mono">'+activeDays+'<span style="font-size:14px;color:#999">일</span></div></div>' +
      '<div class="card"><div class="l">회신</div><div class="n mono">'+totalReplied+
        '</div><div class="l" style="margin-top:2px">'+pct(totalReplied, totalSent)+' 회신율</div></div>' +
      '<div class="card"><div class="l">가장 많은 날</div><div class="n mono">'+busiest.sent+
        '</div><div class="l" style="margin-top:2px">'+esc(busiest.date)+'</div></div>' +
      '<div class="card"><div class="l">중복으로 막힘</div><div class="n mono">'+totalBlocked+'</div></div>' +
    '</div>' +
    '<div class="viz">' +
      '<div class="legend"><span><i style="background:var(--sent)"></i>발송</span>' +
      '<span><i style="background:var(--replied)"></i>회신</span>' +
      '<span class="muted" style="margin-left:auto">막대에 마우스를 올리면 그날 내역이 보입니다</span></div>' +
      '<div class="vizwrap" id="vizWrap">' +
        '<svg width="'+W+'" height="'+H+'" role="img" aria-label="일별 아웃리치 발송 건수">' +
        '<g>'+g+'</g><g>'+bars+'</g><g>'+hits+'</g></svg>' +
        '<div class="tip" id="tip"></div>' +
      '</div>' +
    '</div>' +
    // 차트로 못 읽는 값은 표로 읽는다
    '<div class="scroll" style="margin-top:6px"><table><thead><tr>' +
      '<th>날짜</th><th>발송</th><th>회신</th><th>중복 시도</th><th>담당자별</th>' +
    '</tr></thead><tbody>' +
    rows.slice().reverse().filter(r=>r.sent||r.blocked||r.replied).map(r =>
      '<tr><td class="mono">'+esc(r.date)+'</td>' +
      '<td class="mono">'+r.sent+'</td>' +
      '<td class="mono">'+(r.replied ? '<b style="color:#158a61">'+r.replied+'</b>' : '<span class="muted">0</span>')+'</td>' +
      '<td class="mono">'+(r.blocked ? '<span class="tag hold">'+r.blocked+'</span>' : '<span class="muted">0</span>')+'</td>' +
      '<td>'+esc(Object.keys(r.by||{}).map(k => k+" "+r.by[k]).join(" · "))+'</td></tr>').join("") +
    '</tbody></table></div>';

  wireTips(rows);
  return totalSent + "건";
}

function wireTips(rows){
  const wrap = $("vizWrap"), tip = $("tip");
  if(!wrap || !tip) return;
  wrap.querySelectorAll(".hit").forEach(el => {
    el.addEventListener("mouseenter", () => {
      const r = rows[Number(el.dataset.i)];
      const who = Object.keys(r.by||{});
      tip.innerHTML = '<b>'+esc(r.date)+'</b><br />' +
        '<span class="k">발송</span> <b>'+r.sent+'</b>건' +
        (r.replied ? '<br /><span class="k">회신</span> <b>'+r.replied+'</b>건' : '') +
        (r.blocked ? '<br /><span class="k">중복으로 막힘</span> <b>'+r.blocked+'</b>건' : '') +
        (who.length ? '<br />'+who.map(k => '<span class="k">'+esc(k)+'</span> '+r.by[k]).join('<br />') : '');
      tip.classList.add("on");
      const x = Number(el.getAttribute("x")) + BAND/2 - wrap.scrollLeft;
      tip.style.left = Math.max(4, Math.min(x - tip.offsetWidth/2, wrap.clientWidth - tip.offsetWidth - 4)) + "px";
      tip.style.top = "4px";
    });
    el.addEventListener("mouseleave", () => tip.classList.remove("on"));
  });
}

/* ── 주차별 (담당자 × 주) ──
   주(월~일)마다 담당자별 아웃리치 수와 회신 수. 관리자 포함 전원.
   회신은 그 주에 '받은' 통수 기준. 최신 주가 왼쪽. */
function mdRange(start, end){
  const md = s => { const p = String(s).split("-"); return p.length===3 ? (Number(p[1])+"/"+Number(p[2])) : s; };
  return md(start) + "–" + md(end);
}
function renderWeekly(d){
  const weeks = d.weeks || [];
  const rows = d.rows || [];
  if(!weeks.length){ $("body").innerHTML = emptyNote(d); return ""; }

  const note = '<div class="note">주 기준: 월~일 (한국 시간) · 회신은 그 주에 받은 통수 · 관리자 포함 전원 · 최신 주가 왼쪽' +
    (cronNote(d) ? '<br /><span class="muted">'+cronNote(d)+'</span>' : '') + '</div>';

  const cell = c => {
    c = c || { sent:0, replied:0 };
    if(!c.sent && !c.replied) return '<td class="mono muted">0</td>';
    return '<td class="mono"><b>'+c.sent+'</b>'+
      (c.replied ? '<div class="muted" style="font-size:11px">회신 '+c.replied+'</div>' : '')+'</td>';
  };

  let h = note + '<div class="scroll"><table><thead><tr><th>담당자</th>' +
    weeks.map((w,i) => '<th style="text-align:right">W'+w.week+
      (i===0 ? ' <span class="muted" style="font-weight:400">(<span>이번주</span>)</span>' : '')+
      '<div class="muted" style="font-weight:400;font-size:11px">'+mdRange(w.start, w.end)+'</div></th>').join("") +
    '<th style="text-align:right">합계</th></tr></thead><tbody>' +
    rows.map(r =>
      '<tr><td><b>'+esc(r.name||r.email)+'</b><div class="muted">'+esc(r.email)+'</div></td>' +
      weeks.map(w => cell(r.cells && r.cells[w.key])).join("") +
      '<td class="mono"><b>'+(r.totalSent||0)+'</b>'+
        (r.totalReplied ? '<div class="muted" style="font-size:11px">회신 '+r.totalReplied+'</div>' : '')+'</td></tr>').join("") +
    '</tbody>';

  // 합계 행 — 주마다 팀 전체 아웃리치·회신
  const colSent = weeks.map(w => rows.reduce((s,r)=>s+((r.cells&&r.cells[w.key]&&r.cells[w.key].sent)||0),0));
  const colRep  = weeks.map(w => rows.reduce((s,r)=>s+((r.cells&&r.cells[w.key]&&r.cells[w.key].replied)||0),0));
  h += '<tfoot><tr><th style="text-align:left">전체</th>' +
    weeks.map((w,i) => '<th style="text-align:right" class="mono"><b>'+colSent[i]+'</b>'+
      (colRep[i] ? '<div class="muted" style="font-weight:400;font-size:11px">회신 '+colRep[i]+'</div>' : '')+'</th>').join("") +
    '<th style="text-align:right" class="mono"><b>'+colSent.reduce((a,b)=>a+b,0)+'</b>'+
      '<div class="muted" style="font-weight:400;font-size:11px">회신 '+colRep.reduce((a,b)=>a+b,0)+'</div></th></tr></tfoot>';

  h += '</table></div>';
  $("body").innerHTML = h;
  return "";
}

/* CSV 칸 이스케이프 (승인 내역·회신 인원·주소록 내보내기 공용). 따옴표·쉼표·줄바꿈이 섞여도 엑셀에서 안 깨진다. */
function csvCell(v){ const s = String(v==null?"":v); return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

/* 승인 판단 색 — 🔴 회신 옴(승인 안 함) · 🟠 최근 N일 내 발송(보내지 않음) · 🔵 N일 지남(재발송 가능) */
let BLK_DATA = null, BLK_FILTER = "all";
const DEC_STYLE = {
  replied: { bg:"#fdecea", bd:"#d93025", tagBg:"#fbd3cf", tagFg:"#a1251b" },
  recent:  { bg:"#fff4e0", bd:"#e8890c", tagBg:"#ffe2b3", tagFg:"#8a4b00" },
  ok:      { bg:"#e8f0fe", bd:"#1a73e8", tagBg:"#d2e3fc", tagFg:"#174ea6" },
  unknown: { bg:"",        bd:"#bbb",    tagBg:"#eee",    tagFg:"#666" }
};
function decLabel(dec, n){
  return dec === "replied" ? "🔴 회신 옴" : dec === "recent" ? "🟠 최근 "+n+"일 내 발송" : dec === "ok" ? "🔵 "+n+"일 지남" : "⚪ 발송일 모름";
}
function setBlkFilter(f){ BLK_FILTER = f; if(BLK_DATA) renderBlocked(BLK_DATA); }
function renderBlocked(d){
  BLK_DATA = d;
  const N = d.reapproveDays || 15;
  const allRows = d.rows||[];
  const cnt = k => allRows.filter(r => r.decision === k).length;
  const rows = BLK_FILTER === "all" ? allRows : allRows.filter(r => r.decision === BLK_FILTER);
  // 본인 재시도(원래 보낸 사람 == 시도한 사람)와 다른 담당자와의 겹침을 구분한다.
  // 본인 재시도는 규칙 변경(본인 재발송 허용) **이전**에 막혔던 과거 기록 — 지금은 그냥 발송된다.
  const isSelf = r => {
    const list = (r.origins && r.origins.length) ? r.origins : (r.prior ? [r.prior] : []);
    return list.some(o => o.by && r.by && String(o.by).toLowerCase() === String(r.by).toLowerCase());
  };
  const selfCount = rows.filter(isSelf).length;
  const originsCell = r => {
    const to = r.to || "";
    const list = r.origins || [];
    const reps = r.replies || [];
    // 한 줄을 누르면 그 담당자 메일함의 그 크리에이터 대화(제목·내용)를 연다
    // 관리자 메일함(본인 제외)은 대화를 열지 않는다 — 누가·언제만 보이고 '📄 내용' 링크가 없다
    const line = (staff, inner) => (to && canOpen(staff))
      ? '<div class="threadline" data-thread-staff="'+esc(staff)+'" data-thread-peer="'+esc(to)+'" style="cursor:pointer" title="이 메일 내용 보기">'+inner+
          ' <span class="muted" style="font-size:11px;white-space:nowrap">📄 내용</span></div>'
      : '<div>'+inner+'</div>';
    let h = "";
    if(!list.length) h += '<span class="muted">—</span>';
    else {
      const nSent = r.originsTotal || list.length;
      if(nSent > 1) h += '<div class="muted" style="font-size:11px;margin-bottom:2px">발송 '+nSent+'건</div>';
      h += list.map(o => line(o.by,
        '<b>'+esc(o.byName||o.by||'—')+'</b> <span class="mono muted">'+esc(fmt(o.at))+'</span>'+
        (o.campaign ? ' · <span class="muted">'+esc(o.campaign)+'</span>' : '')+
        (o.mailbox ? ' <span class="tag" style="background:#f1f1f1;color:#555" title="네이버웍스 보낸편지함 (단체·참조·숨은참조 포함)">메일함</span>' : '')+
        (o.forced ? ' <span class="tag forced">강제</span>' : ''))).join("");
    }
    // 크리에이터가 회신했으면 — 누구에게·어떤 제목인지. 누르면 그 회신 내용이 열린다.
    if(reps.length){
      h += '<div style="margin-top:6px;border-top:1px solid #eee;padding-top:6px">' +
        reps.map(q => line(q.inbox||q.by,
          '<span class="tag" style="background:#e8f5ec;color:#1f7a44">💬 회신</span> '+
          '<b>'+esc(q.byName||q.by||'—')+'</b> <span class="mono muted">'+esc(fmt(q.at))+'</span>'+
          (q.subject ? ' · <span class="muted">'+esc(q.subject)+'</span>' : '')+
          (q.mailbox ? ' <span class="tag" style="background:#f1f1f1;color:#555" title="담당자 메일함으로 들어온 메일">메일함</span>' : ''))).join("") +
        '</div>';
    }
    return h;
  };

/* 중복으로 막혔던 크리에이터를 발송 화면으로 넘긴다 (관리자 강제 발송).
   메일 본문은 저장하지 않으므로 내용은 발송 화면에서 새로 작성한다 — 여기서는 수신자만 넘긴다. */
function toggleAllBlocked(cb){
  document.querySelectorAll(".blkchk").forEach(c => { c.checked = cb.checked; });
}
function forceSelectedBlocked(){
  const picks = [...document.querySelectorAll(".blkchk:checked")].map(c => ({
    to: c.getAttribute("data-to") || "",
    name: c.getAttribute("data-name") || "",
    handle: c.getAttribute("data-handle") || ""
  })).filter(p => p.to);
  if(!picks.length){ alert("발송할 크리에이터를 선택하세요 (이메일이 있는 건만 가능)."); return; }
  try { localStorage.setItem("outreach_prefill", JSON.stringify({ force:true, from:"blocked", recipients:picks })); } catch(e){}
  location.href = "/";
}

/* 선택한 막힌 건을 **승인** 한다 — 원래 시도했던 담당자가 자기 계정으로 다시 보내면 통과한다.
   (관리자가 대신 보내는 강제 발송과 달리, 발신자는 그 담당자 그대로.) */
const APPROVAL_HEAD = ["Approved staff","Staff email","Creator handle","Creator email","Creator name","Approved at","Approved by (admin)"];
let LAST_APPROVED = [];   // 방금 승인한 건들 (즉시 다운로드용)

// CSV 다운로드 (영어 헤더, UTF-8 BOM 으로 엑셀 한글 안 깨짐)
function downloadCsv(filename, lines){
  const csv = "﻿" + lines.join("\r\n");
  const blob = new Blob([csv], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function approveSelectedBlocked(){
  const items = [...document.querySelectorAll(".blkchk:checked")].map(c => ({
    by: c.getAttribute("data-by") || "",
    byName: c.getAttribute("data-byname") || "",
    to: c.getAttribute("data-to") || "",
    handle: c.getAttribute("data-handle") || "",
    name: c.getAttribute("data-name") || ""
  })).filter(x => x.by && (x.to || x.handle));
  if(!items.length){ alert("승인할 건을 선택하세요 (시도한 담당자가 있는 건만 가능)."); return; }
  // 🔴 회신 옴 · 🟠 최근 발송이 섞여 있으면 한 번 더 묻는다
  const picked = [...document.querySelectorAll(".blkchk:checked")];
  const nRep = picked.filter(c => c.getAttribute("data-dec") === "replied").length;
  const nRecent = picked.filter(c => c.getAttribute("data-dec") === "recent").length;
  if((nRep || nRecent) && !window.confirm(
      "선택한 건 중 " + (nRep ? "🔴 회신 온 크리에이터 " + nRep + "명" : "") + (nRep && nRecent ? ", " : "") +
      (nRecent ? "🟠 최근 발송 " + nRecent + "명" : "") + "이 포함돼 있습니다. 그래도 승인할까요?")) return;
  const msg = $("blkMsg");
  if(msg) msg.textContent = "승인 중…";
  try {
    const r = await fetch("/api/admin", {
      method:"POST", cache:"no-store",
      headers: Object.assign({ "content-type":"application/json" }, headers()),
      body: JSON.stringify({ action:"approve", items })
    });
    if(r.status === 401){ showGate("다시 로그인해 주세요."); throw new Error("로그인이 필요합니다"); }
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    // 방금 승인한 내역을 바로 엑셀로 받을지 물어본다 (목록 새로고침 전에 — confirm 은 새로고침에 안 지워짐)
    LAST_APPROVED = items;
    if((d.approved||0) > 0 && window.confirm((d.approved) + "건 승인 완료.\n방금 승인한 내역(담당자·핸들·이메일)을 엑셀(CSV)로 받으시겠습니까?")){
      exportJustApproved();
    }
    if(msg) msg.textContent = (d.approved||0) + "건 승인됨 · 담당자가 다시 보내면 발송됩니다.";
    load();   // 목록 새로고침 → '승인됨' 배지 표시
  } catch(e){ if(msg) msg.textContent = ""; alert("승인 실패: " + String(e.message||e)); }
}

// 방금 승인한 건들만 즉시 CSV 로 (승인일 = 지금, 승인자 = 로그인한 관리자)
function exportJustApproved(){
  if(!LAST_APPROVED.length){ alert("승인한 내역이 없습니다."); return; }
  const now = fmt(new Date().toISOString());
  const admin = (ME && (ME.name || ME.email)) || "";
  const lines = [APPROVAL_HEAD.map(csvCell).join(",")].concat(
    LAST_APPROVED.map(r => [r.byName||r.by, r.by, r.handle, r.to, r.name, now, admin].map(csvCell).join(","))
  );
  downloadCsv("approved_" + new Date().toISOString().slice(0,10) + ".csv", lines);
}

/* 관리자 승인 내역 전체를 엑셀(CSV, 영어 헤더)로 내려받는다 — 누구를(담당자)·크리에이터 핸들/이메일·승인일. */
async function exportApprovalsCsv(){
  const msg = $("blkMsg"); if(msg) msg.textContent = "불러오는 중…";
  try {
    const d = await fetchJson("/api/admin?view=approvals");
    const rows = (d && d.rows) || [];
    if(!rows.length){ if(msg) msg.textContent = ""; alert("승인 내역이 없습니다."); return; }
    const lines = [APPROVAL_HEAD.map(csvCell).join(",")].concat(
      rows.map(r => [r.byName||r.by, r.by, r.handle, r.to, r.name, fmt(r.at), r.approvedBy].map(csvCell).join(","))
    );
    downloadCsv("approvals_" + new Date().toISOString().slice(0,10) + ".csv", lines);
    if(msg) msg.textContent = rows.length + "건 내보냄";
  } catch(e){ if(msg) msg.textContent = ""; alert("내보내기 실패: " + String(e.message||e)); }
}

/* ── 대화 (담당자 ↔ 크리에이터 협상) ──
   회신한 크리에이터만 목차로 띄운다(협상은 회신이 있어야 성립). 한 명을 누르면
   그 담당자 메일함에서 주고받은 스레드를 본문까지 그때그때 읽어 온다. */

/* ── 📒 주소록 ──
   담당자별로 누가 회신했는지(기본) · 누구에게 보냈는지 · 누구에게서 받았는지 — **주소만**.
   내용·제목은 보여주지 않는다(기록은 그대로 보관). 메일 내용(대화)도 여기서 열 수 없다. */
let BOOK_DIR = "replied";
let BOOK_ROWS = [];
function setBookDir(d){ BOOK_DIR = d; load(); }
function renderBook(d){
  const rows = d.rows || [];
  BOOK_ROWS = rows;
  const dir = BOOK_DIR;
  const allStaff = !$("by").value;
  const CAP = 2000;
  const LABEL = { replied:"회신 온 사람", sent:"보낸 주소", recv:"받은 주소" };

    '<span class="muted"><span>'+LABEL[dir]+'</span> <b>'+rows.length+'명</b></span></div>' +
    '<div id="bookFill"></div>' + bookStatusHtml(d.status || [], d.msgUsage);
  const note = '<div class="note">' + (
    dir === "replied" ? '<span>회신 온 사람 = 담당자 메일함으로 메일이 온 사람 중, 우리가 먼저 보낸 적 있는 주소 (관리자 포함 전원).</span>'
    : dir === "sent" ? '<span>보낸 주소 = 메일함 보낸편지함의 모든 외부 수신자(단체·참조·숨은참조 포함) + 이 툴로 보낸 기록.</span>'
    : '<span>받은 주소 = 받은편지함·사용자 폴더(보낸편지함·임시·휴지통·스팸 제외)의 회사 밖 발신자 전부.</span>') +
    ' <span class="muted">주소록에는 내용·제목을 표시하지 않습니다 (기록은 그대로 보관) · 2026-05-01 이후.</span></div>';
  if(!rows.length){
    $("body").innerHTML = toggle + note + '<div class="muted" style="padding:20px 0">아직 채워진 주소가 없습니다 — [🔄 네이버웍스에서 지금 채우기] 를 누르세요.</div>';
    return "";
  }
  // 주소록은 **주소만** — 줄을 눌러 메일 내용(대화)을 여는 기능은 두지 않는다
  const cell = r => '<td><b>'+esc(r.name||"—")+'</b><div class="muted">'+esc(r.email)+(r.handle?' · @'+esc(String(r.handle).replace(/^@/,"")):'')+'</div></td>';
  const SRC = { tool:'<span class="tag" style="background:#e7f0ff;color:#2f5fb0">툴 발송</span>', mailbox:'<span class="tag" style="background:#f1f1f1;color:#555">메일함</span>' };
  const head = dir === "replied"

    : '<td class="muted">'+esc(r.box||"")+'</td><td>'+(r.emailed ? '<span class="tag" style="background:#e8f5ec;color:#1f7a44">✓ 회신</span>' : '<span class="muted">—</span>')+'</td>';

function exportBookCsv(){
  const rows = BOOK_ROWS || [];
  if(!rows.length){ alert("내보낼 주소가 없습니다"); return; }
  const dir = BOOK_DIR;
  const H = r => r.handle ? "@"+String(r.handle).replace(/^@/,"") : "";
  const head = dir === "replied" ? ["Staff","Staff email","Address","Name","Handle","Replies","First reply","Last reply","Folder"]
    : dir === "sent" ? ["Staff","Staff email","Address","Name","Handle","Messages","First","Last","Source"]
    : ["Staff","Staff email","Address","Name","Handle","Messages","First","Last","Folder","We emailed them"];
  const lines = [head.map(csvCell).join(",")].concat(rows.map(r => (
      dir === "replied" ? [r.staffName||r.staff, r.staff, r.email, r.name, H(r), r.n||0, fmt(r.first), fmt(r.last), r.box]
    : dir === "sent" ? [r.staffName||r.staff, r.staff, r.email, r.name, H(r), r.n||0, fmt(r.first), fmt(r.last), (r.src||[]).map(x => x==="tool"?"Tool":"Mailbox").join(" + ")]
    : [r.staffName||r.staff, r.staff, r.email, r.name, H(r), r.n||0, fmt(r.first), fmt(r.last), r.box, r.emailed ? "Yes (reply)" : "No"]
  ).map(csvCell).join(",")));
  const who = ($("by").value || "all").replace(/@.*/,"");
  const tag = { replied:"replied", sent:"sent", recv:"received" }[dir];
  downloadCsv("addresses_" + tag + "_" + who + "_" + new Date().toISOString().slice(0,10) + ".csv", lines);
}

/* 담당자별 채움 상태 — 네이버웍스에서 어느 폴더를 보낸편지함으로 읽었는지 · 주소 수 · 진행 · 오류 */
function bookStatusHtml(list, usage){
  if(!list.length) return "";
  const u = usage || {};
  const usageLine = '<div class="muted" style="margin:6px 0">🗄 <span>메일 데이터베이스 (본문 포함)</span> — ' + (u.usedMB||0) + ' / ' + (u.capMB||0) + ' MB' +
    (u.full ? ' · <b style="color:#a23b2e"><span>용량 상한에 도달해 이후 메일은 본문 없이 기록만 저장합니다</span></b>' : '') + '</div>';
  const stateOf = x => x.error ? '<span class="tag" style="background:#fde8e6;color:#a23b2e">오류</span>'
    : (x.sentCaughtUp && x.foldersCaughtUp && x.msgsCaughtUp) ? '<span class="tag" style="background:#e8f5ec;color:#1f7a44">완료</span>'
    : x.at ? '<span class="tag" style="background:#fff3d6;color:#8a5a00">채우는 중</span>'
    : '<span class="tag" style="background:#f1f1f1;color:#666">대기</span>';
  return '<details style="margin:0 0 12px"><summary class="muted" style="cursor:pointer">📊 담당자별 채움 상태</summary>' +
    '<div class="scroll"><table><thead><tr><th>담당자</th><th>상태</th><th>보낸편지함 폴더</th><th>보낸 주소</th><th>받은 주소</th><th>저장된 메일</th><th>마지막 동기화</th></tr></thead><tbody>' +
    list.map(x => '<tr><td>'+esc(x.staffName||x.staff)+'</td><td>'+stateOf(x)+
      (x.error ? '<div class="muted" style="font-size:11px">'+esc(x.error)+'</div>' : '')+'</td>' +
      '<td class="muted">'+esc(x.sentFolder||"—")+'</td>' +
      '<td class="mono">'+(x.sentBook||0)+'</td><td class="mono">'+(x.recvBook||0)+'</td><td class="mono">'+(x.messages||0)+'</td>' +
      '<td class="mono muted">'+esc(fmt(x.at))+'</td></tr>').join("") +
    '</tbody></table></div>' + usageLine + '</details>';
}
/* 🔄 네이버웍스에서 지금 채우기 — 고른 담당자(없으면 전원)의 메일함을 끝까지 읽을 때까지 자동 반복.
   한 번 호출은 60초 제한 안에서 이어서 처리하고(커서), 다 읽으면 다음 담당자로 넘어간다. */
let BOOK_FILLING = false;
async function fillBook(){
  if(BOOK_FILLING) return;
  BOOK_FILLING = true;
  const box = $("bookFill");
  const people = $("by").value ? [{ email: $("by").value, name: ($("by").selectedOptions[0]||{}).textContent || $("by").value }]
    : [...$("by").options].slice(1).map(o => ({ email: o.value, name: o.textContent }));
  const MAX_ROUNDS = 40;   // 한 사람당 최대 약 30분 — 남으면 자동 수집이 이어서 처리한다
  const done = [], failed = [];
  try {
    for(let i = 0; i < people.length; i++){
      const p = people[i];
      for(let round = 1; round <= MAX_ROUNDS; round++){
        box.innerHTML = '<div class="hold" style="margin-bottom:10px"><b>'+(i+1)+'/'+people.length+'</b> '+esc(p.name)+
          ' <span>네이버웍스 메일함을 읽는 중…</span> <span class="muted">('+round+')</span></div>';
        let r;
        try { r = await postJson("/api/replies", { user: p.email }); }
        catch(e){
          if(/시간 초과/.test(String(e.message))) continue;   // 이어서 처리된다 — 한 번 더
          failed.push(p.name + " — " + String(e.message||e)); break;
        }
        const x = (r.results || [])[0] || {};
        if(x.error){ failed.push(p.name + " — " + x.error); break; }
        // 주소록 + 메일 데이터베이스(본문)까지 다 따라잡을 때까지
        const more = x.waiting || (x.folders || []).some(f => f.truncated || f.skipped) || x.messagesCaughtUp === false;
        if(!more){ done.push(p.name); break; }
        if(round === MAX_ROUNDS) failed.push(p.name + " — 아직 남음, 다시 누르면 이어서 처리");
      }
    }
    box.innerHTML = '<div class="'+(failed.length?'hold':'ok')+'" style="margin-bottom:10px"><span>채우기 끝</span> — ' +
      '<span>완료</span> <b>'+done.length+'명</b>' +
      (failed.length ? '<div style="margin-top:4px;color:#a23b2e">'+failed.map(esc).join("<br />")+'</div>' : '') + '</div>';
  } finally {
    BOOK_FILLING = false;
    const keep = box.innerHTML;
    await load();
    const b2 = $("bookFill"); if(b2) b2.innerHTML = keep;
  }
}

/* 서버 요청 (주소록 채우기 등) — 시간 초과·오류 페이지도 알아볼 수 있는 메시지로 */
async function postJson(url, body){ return reqJson(url, { method:"POST", body }); }
/* JSON 이 아닌 응답(시간 초과·서버 오류 페이지)도 알아볼 수 있는 메시지로 바꾼다 */
async function reqJson(url, o){
  o = o || {};
  const r = await fetch(url, o.method === "POST"
    ? { method:"POST", cache:"no-store", headers: Object.assign({ "content-type":"application/json" }, headers()), body: JSON.stringify(o.body||{}) }
    : { cache:"no-store", headers: headers() });
  if(r.status === 401){ showGate("다시 로그인해 주세요."); throw new Error("로그인이 필요합니다"); }
  const text = await r.text();
  let d = null;
  try { d = JSON.parse(text); } catch(_) {
    if(r.status === 504 || /timeout|FUNCTION_INVOCATION/i.test(text))
      throw new Error("시간 초과 — 메일이 많아 한 번에 못 끝냈습니다. 다시 누르면 이어서 처리됩니다.");
    throw new Error("서버 오류 (HTTP "+r.status+")");
  }
  if(d.error) throw new Error(d.error);
  return d;
}

function renderConversations(d){
  const rows = d.rows || [];
  if(!rows.length){
    $("body").innerHTML = truncNote(d) +
      '<div class="note"><b>아직 회신 대화가 없습니다.</b><br />' +
      '담당자별 탭에서 <b>[🔄 메일함에서 동기화]</b> 를 먼저 돌려 회신을 채우세요. ' +
      '회신한 크리에이터만 여기 대화로 뜹니다.</div>';
    return "";
  }
  let total = 0;
  $("body").innerHTML = truncNote(d) + rows.map(s => {
    total += s.creators.length;
    return '<div class="convgrp"><div class="convby">'+esc(s.byName||s.by)+
      ' <span class="muted">· 대화 '+s.creators.length+'명</span></div>' +
      '<div class="scroll"><table><thead><tr>' +
      '<th>크리에이터</th><th>회신</th><th>발송</th><th>최근</th><th>최근 제목</th>' +
      '</tr></thead><tbody>' +
      s.creators.map(c =>
        '<tr class="convrow" data-staff="'+esc(s.by)+'" data-peer="'+esc(c.email)+'">' +
        '<td><b>'+esc(c.name||"—")+'</b><div class="muted">'+esc(c.email)+'</div></td>' +
        '<td class="mono">'+(c.replies||0)+'</td>' +
        '<td class="mono">'+(c.sent||0)+'</td>' +
        '<td class="mono muted">'+esc(fmt(c.lastAt))+'</td>' +
        '<td class="muted">'+esc(c.lastSubject||"")+'</td></tr>'
      ).join("") +
      '</tbody></table></div></div>';
  }).join("");
  // onclick 을 문자열로 박지 않고 data-* + 위임으로 — 이메일에 따옴표가 섞여도 안전하다
  [...document.querySelectorAll(".convrow")].forEach(tr => {
    if(canOpen(tr.dataset.staff)) tr.addEventListener("click", () => openThread(tr.dataset.staff, tr.dataset.peer));
  });
  return total + "명과 대화";
}

async function openThread(staff, peer){
  if(!canOpen(staff)) return;   // 관리자 메일함(본인 제외)의 대화는 열지 않는다 — 서버도 거부한다
  $("threadModal").style.display = "flex";
  $("threadHead").innerHTML = esc(peer);
  $("threadBody").innerHTML = '<div class="muted" style="padding:24px 8px">불러오는 중… (메일함을 직접 읽습니다)</div>';
  try {
    const d = await fetchJson("/api/thread?staff="+encodeURIComponent(staff)+"&peer="+encodeURIComponent(peer));
    renderThread(d);
  } catch(e){
    $("threadBody").innerHTML = '<div class="err" style="margin:8px">'+esc(String(e.message||e))+'</div>';
  }
}
function renderThread(d){
  $("threadHead").innerHTML = esc(d.staff||"") + ' <span class="muted">↔</span> ' + esc(d.peer||"");
  const rows = d.rows || [];
  if(!rows.length){
    $("threadBody").innerHTML = '<div class="muted" style="padding:24px 8px">이 대화의 메일을 찾지 못했습니다. (기간이 2026-05-01 이후인지 확인하세요)</div>';
    return;
  }
  $("threadBody").innerHTML = rows.map(m => {
    const out = m.direction === "out";
    return '<div class="bubble '+(out?"out":"in")+'">' +
      '<div class="bh"><span>'+(out?"담당자":"크리에이터")+'</span> · '+esc(fmt(m.at))+'</div>' +
      (m.subject ? '<div class="bsub">'+esc(m.subject)+'</div>' : '') +
      '<div class="btext">'+esc(m.body||"(본문 없음)")+'</div></div>';
  }).join("");
  $("threadBody").scrollTop = $("threadBody").scrollHeight;   // 최신 메일이 보이게 맨 아래로
}
function closeThread(){ $("threadModal").style.display = "none"; $("threadBody").innerHTML = ""; }
// 배경(veil) 클릭·ESC 로 닫기
document.addEventListener("click", e => { if(e.target && e.target.id === "threadModal") closeThread(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeThread(); });

/* 중복 시도 등에서 크리에이터를 누르면 그 담당자 메일함의 대화(제목·내용)를 연다.
   staff = 메일함 주인(보낸 담당자), peer = 크리에이터 이메일. 이메일·담당자가 있어야 클릭 가능. */
function threadCell(staff, to, name, badge, handle){
  const b = badge || "";
  const h = handle ? String(handle).replace(/^@/,"") : "";
  const label = '<b>'+esc(name||"—")+'</b>'+b+'<div class="muted">'+esc(to||"")+'</div>' +
    (h ? '<div class="mono" style="font-size:12px;color:#555">@'+esc(h)+'</div>' : '');
  if(!to || !canOpen(staff)) return '<td>'+label+'</td>';
  return '<td class="threadcell" data-thread-staff="'+esc(staff)+'" data-thread-peer="'+esc(to)+'" ' +
    'style="cursor:pointer" title="대화 보기 — 메일함에서 제목·내용을 직접 읽습니다">' + label +
    ' <span class="muted" style="font-size:11px;white-space:nowrap">💬 대화</span></td>';
}
/* 인하우스 협업 크리에이터 배지 (핸들 기준). 중복시도·대상 칸에 붙는다. */
const IH_VIA = { linked:"발송 기록 연결", "sheet-email":"시트 이메일", "email-prefix":"이메일 주소로 추정" };
function inhouseBadge(r){
  if(!(r && r.inhouse)) return "";
  const via = r.inhouseVia && r.inhouseVia !== "handle" ? IH_VIA[r.inhouseVia] : "";
  return ' <span class="tag" style="background:#fff3d6;color:#8a5a00" title="달바 인하우스 협업 크리에이터 리스트에 있는 크리에이터입니다">🤝 협업 중</span>' +
    (r.inhouseHandle && via
      ? ' <span class="muted" style="font-size:11px">@'+esc(r.inhouseHandle)+' · <span>'+via+'</span></span>' : '');
}
document.addEventListener("click", e => {
  const c = e.target.closest && e.target.closest("[data-thread-peer]");
  if(c && !(e.target.closest && e.target.closest("input,button,a")))
    openThread(c.getAttribute("data-thread-staff"), c.getAttribute("data-thread-peer"));
});

/* ── 내 파이프라인 (개인용 칸반) ──
   내가 접촉한 크리에이터를 회신 횟수로 단계를 나눠 보여준다: 첫 발송 → 1차 회신 → 2차+ 회신.
   카드를 누르면 그 크리에이터와의 대화 스레드가 열린다. */
const PIPE_STAGES = [
  { key:"outreach", label:"첫 발송 · 회신 대기", color:"#9aa0a6" },
  { key:"remind1",  label:"1차 리마인드 보냄",   color:"#e0a53b" },
  { key:"remind2",  label:"2차+ 리마인드 보냄",  color:"#d97a2b" },
  { key:"reply1",   label:"1차 회신",           color:"#4f9cf5" },
  { key:"reply2",   label:"2차+ 회신 · 협상",    color:"#158a61" }
];
function pipeCard(c){
  return '<div class="kcard" data-peer="'+esc(c.email)+'">' +
    '<div class="knm">'+esc(c.name||c.email)+'</div>' +
    (c.handle ? '<div class="kh">@'+esc(String(c.handle).replace(/^@/,""))+'</div>' : '<div class="kh">'+esc(c.email)+'</div>') +
    '<div class="kmeta"><span class="kbadge">회신 '+(c.replies||0)+'</span><span>발송 '+(c.sends||0)+'</span>'+
      (c.reminds ? '<span class="krem">리마인드 '+c.reminds+'</span>' : '')+
      '<span class="muted">'+esc(fmt(c.lastAt))+'</span></div>' +
    (c.lastSubject ? '<div class="ksub">'+esc(c.lastSubject)+'</div>'
      : (c.campaign ? '<div class="ksub">'+esc(c.campaign)+'</div>' : '')) +
    '</div>';
}
function renderPipeline(d){
  const rows = d.rows || [];
  const who = d.pipelineOf || (d.me && d.me.email) || "";
  if(!rows.length){
    $("body").innerHTML = '<div class="note"><b>아직 내 파이프라인에 크리에이터가 없습니다.</b><br />' +
      '내가 보낸 발송·받은 회신이 잡히면 여기 단계별로 뜹니다. ' +
      '담당자별 탭에서 <b>[🔄 메일함에서 동기화]</b> 를 먼저 돌려보세요.</div>';
    return "";
  }
  const bucket = {}; PIPE_STAGES.forEach(s => bucket[s.key] = []);
  rows.forEach(r => { (bucket[r.stage] || bucket.outreach).push(r); });
  $("body").innerHTML =
    '<div class="muted" style="margin:-2px 0 10px;font-size:12.5px">'+esc(who)+' <span>'+(canOpen(who) ? '님 기준 · 카드를 누르면 대화가 열립니다' : '님 기준 · 관리자 메일함이라 대화는 열 수 없습니다')+'</span></div>' +
    '<div class="kan">' + PIPE_STAGES.map(s => {
      const list = bucket[s.key];
      return '<div class="kcol"><div class="khead"><span class="kdot" style="background:'+s.color+'"></span>' +
        esc(s.label) + '<span class="kcount">'+list.length+'</span></div>' +
        '<div class="klist">' + (list.length ? list.map(pipeCard).join("") : '<div class="kempty">없음</div>') + '</div></div>';
    }).join("") + '</div>';
  if(canOpen(who)) [...document.querySelectorAll(".kcard")].forEach(el =>
    el.addEventListener("click", () => openThread(who, el.dataset.peer)));
  return rows.length + "명";
}

/* ── 메일함에서 동기화 ──
   담당자별로 ① 보낸편지함 → 발송 이력, ② 받은편지함 → 회신 기록 순으로 채운다.
   전원을 한 요청에 몰면 함수 제한시간(60초)을 넘기므로 **한 사람씩 나눠서** 부르고,
   진행 상황을 그때그때 보여준다 — 오래 걸리는 작업이 말없이 도는 게 제일 나쁘다.

   보낸편지함에는 아웃리치가 아닌 메일이 섞여 있다. 사내 도메인 수신자와
   여러 명에게 보낸 메일(6명 이상)은 서버가 자동으로 걸러낸다. */
const SYNC_SINCE = "2026-05-01";
let SYNC_RESULT = null;   // 마지막 동기화 결과 — 화면을 다시 그려도 남아 있어야 한다

async function syncAll(){
  const btn = $("syncBtn"), msg = $("syncMsg");
  if(!btn) return;
  btn.disabled = true;

  const people = [...$("by").options].slice(1).map(o => ({ email:o.value, name:o.textContent }));
  if(!people.length){ msg.textContent = "등록된 담당자가 없습니다 (NW_ACCOUNTS)."; btn.disabled = false; return; }

  // 함수가 시간을 넘기면 Vercel 이 JSON 이 아니라 오류 **페이지**를 돌려준다.
  // 그걸 그대로 JSON 으로 읽으면 "Unexpected token 'A'" 같은 쓸모없는 말이 뜬다 —
  // 무엇이 잘못됐는지 사람이 알아볼 수 있게 상태 코드로 풀어서 알려준다.
  const call = async (url, body) => {
    const r = await fetch(url, {
      method:"POST", cache:"no-store",
      headers: Object.assign({ "content-type":"application/json" }, headers()),
      body: JSON.stringify(body)
    });
    if(r.status === 401){ showGate("다시 로그인해 주세요."); throw new Error("로그인이 필요합니다"); }
    const text = await r.text();
    let d = null;
    try { d = JSON.parse(text); } catch(_) {
      if(r.status === 504 || /timeout|FUNCTION_INVOCATION/i.test(text))
        throw new Error("시간 초과 — 메일이 많아 한 번에 못 끝냈습니다. 다시 누르면 이어서 처리됩니다.");
      throw new Error("서버 오류 (HTTP "+r.status+")");
    }
    if(d.error) throw new Error(d.error);
    return d;
  };

  let sent = 0, replies = 0;
  const failed = [];
  for(let i = 0; i < people.length; i++){
    const p = people[i];
    SYNC_RESULT = '<b>'+(i+1)+'/'+people.length+'</b> '+esc(p.name)+' 메일함을 읽는 중… ' +
      '<span class="muted">(인원에 따라 몇 분 걸릴 수 있습니다)</span>';
    msg.innerHTML = SYNC_RESULT;
    try {
      const b = await call("/api/backfill", { user:p.email, since:SYNC_SINCE, dryRun:false });
      sent += (b.result && b.result.imported) || 0;
      const r = await call("/api/replies", { user:p.email, since:SYNC_SINCE });
      replies += (r.totals && r.totals.found) || 0;
    } catch(e){
      if(/로그인/.test(String(e.message))) { btn.disabled = false; return; }
      failed.push(p.name + " — " + String(e.message||e));
    }
  }

  SYNC_RESULT = (failed.length ? '동기화 끝 (일부 실패)' : '동기화 완료') +
    ' · 새 발송 <b>'+sent+'</b>건 · 새 회신 <b>'+replies+'</b>건' +
    ' <span class="muted">(2026-05-01 이후, 이미 있던 건 건너뜀)</span>' +
    (failed.length ? '<br /><span style="color:#a23b2e">실패: '+esc(failed.join(" / "))+'</span>' : '');
  msg.innerHTML = SYNC_RESULT;
  btn.disabled = false;
  load();
}

/* ── 시작 ── */
async function boot(){
  if(!token()){ showGate(""); return; }
  try {
    const r = await fetch("/api/admin", { cache:"no-store", headers: headers() });
    const d = await r.json();
    if(r.status === 401){ showGate("다시 로그인해 주세요."); return; }
    if(r.status === 403){
      $("gate").style.display="none"; $("app").style.display="";
      $("msg").innerHTML = '<div class="err">'+esc(d.error)+'</div>';
      document.querySelector(".tabs").style.display = "none";
      $("filters").style.display = "none";
      return;
    }
    ME = d.me || null;
    $("gate").style.display = "none";
    $("app").style.display = "";
    // 이름은 사람마다 다르므로 번역 대상에서 분리한다 — "· 관리자" 만 사전에 있으면 된다
    $("who").innerHTML = ME ? esc(ME.name || ME.email) + ' <span>· 관리자</span>' : "";
    fillStaffPicker(d.accounts);
    // 저장소 미연결은 본문에서 설명하므로 위에 빨간 띠를 겹쳐 띄우지 않는다
    if(d.error && d.historyEnabled !== false){ $("msg").innerHTML = '<div class="err">'+esc(d.error)+'</div>'; }
    go("summary");
  } catch(e){
    $("gate").style.display="none"; $("app").style.display="";
    $("msg").innerHTML = '<div class="err">'+esc(String(e.message||e))+'</div>';
  }
}
boot();
